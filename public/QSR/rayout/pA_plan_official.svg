<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Noto Sans JP', sans-serif; font-weight: 900; fill: #111; font-size: 24px; }
      .subtitle { font-family: 'Noto Sans JP', sans-serif; font-weight: 700; fill: #E60012; font-size: 14px; }
      .label { font-family: 'Noto Sans JP', sans-serif; font-weight: 700; fill: #1E293B; font-size: 11px; }
      .small-label { font-family: 'Noto Sans JP', sans-serif; font-weight: 600; fill: #475569; font-size: 9px; }
      .wall { fill: #334155; stroke: #0F172A; stroke-width: 4; }
      .partition-wall { fill: #475569; stroke: #1E293B; stroke-width: 5; }
      .equipment { fill: #F1F5F9; stroke: #475569; stroke-width: 1.5; rx: 4; }
      .highlight-equip { fill: #FEF08A; stroke: #CA8A04; stroke-width: 2; rx: 4; }
      .red-equip { fill: #FEE2E2; stroke: #DC2626; stroke-width: 2; rx: 4; }
      .blue-equip { fill: #E0F2FE; stroke: #0284C7; stroke-width: 2; rx: 4; }
      .flow-customer { stroke: #EAB308; stroke-width: 3.5; stroke-dasharray: 6,4; fill: none; marker-end: url(#arrow-yellow); }
      .flow-staff { stroke: #2563EB; stroke-width: 2.5; fill: none; marker-end: url(#arrow-blue); }
    </style>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#EAB308"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <!-- HEADER -->
  <g transform="translate(40, 25)">
    <circle cx="24" cy="24" r="22" fill="#FFD100" stroke="#000" stroke-width="2"/>
    <path d="M 12 16 Q 24 8 36 16" stroke="#000" stroke-width="3" fill="none"/>
    <circle cx="16" cy="24" r="2.5" fill="#000"/>
    <circle cx="32" cy="24" r="2.5" fill="#000"/>
    <circle cx="14" cy="28" r="4" fill="#E60012"/>
    <circle cx="34" cy="28" r="4" fill="#E60012"/>
    <path d="M 16 34 Q 24 40 32 34" stroke="#000" stroke-width="3" fill="none"/>
    
    <text x="60" y="24" class="title">元気寿司 エクスプレス 店舗レイアウト平面図［パターンA：標準モデル］</text>
    <text x="60" y="44" class="subtitle">【仕様】店舗45㎡ (幅9m×奥行5m) • 敷地外イートイン8席 • 炊飯器2台 • SUZUMO巻きロボ • 手洗い専用シンク • 完全目隠し仕切り壁 • 左側POS</text>
  </g>

  <!-- OUTSIDE EAT-IN AREA (Left Side Outside) -->
  <g transform="translate(40, 100)">
    <rect width="180" height="520" fill="#F0F9FF" stroke="#0284C7" stroke-width="2" stroke-dasharray="4,4" rx="8"/>
    <text x="90" y="30" class="label" text-anchor="middle" fill="#0369A1">敷地外 イートインスペース</text>
    <text x="90" y="48" class="small-label" text-anchor="middle" fill="#0284C7">(モール共用通路沿い 8席)</text>

    <!-- Table 1 -->
    <g transform="translate(40, 100)">
      <rect x="25" y="0" width="50" height="50" fill="#FDE68A" stroke="#B45309" stroke-width="2" rx="4"/>
      <!-- Chairs -->
      <circle cx="10" cy="25" r="10" fill="#94A3B8"/>
      <circle cx="90" cy="25" r="10" fill="#94A3B8"/>
      <circle cx="50" cy="-12" r="10" fill="#94A3B8"/>
      <circle cx="50" cy="62" r="10" fill="#94A3B8"/>
      <text x="50" y="29" class="small-label" text-anchor="middle">4席</text>
    </g>

    <!-- Table 2 -->
    <g transform="translate(40, 320)">
      <rect x="25" y="0" width="50" height="50" fill="#FDE68A" stroke="#B45309" stroke-width="2" rx="4"/>
      <!-- Chairs -->
      <circle cx="10" cy="25" r="10" fill="#94A3B8"/>
      <circle cx="90" cy="25" r="10" fill="#94A3B8"/>
      <circle cx="50" cy="-12" r="10" fill="#94A3B8"/>
      <circle cx="50" cy="62" r="10" fill="#94A3B8"/>
      <text x="50" y="29" class="small-label" text-anchor="middle">4席</text>
    </g>
  </g>

  <!-- MAIN STORE BOUNDARY (45sqm: 9m x 5m) -->
  <g transform="translate(240, 100)">
    <!-- Main Outer Wall -->
    <rect width="900" height="520" fill="#FFF7ED" stroke="#0F172A" stroke-width="6" rx="4"/>

    <!-- ZONE 1: BACKROOM (Top Right 10sqm) -->
    <g transform="translate(680, 0)">
      <rect width="220" height="240" fill="#E2E8F0" stroke="#475569" stroke-width="4"/>
      <text x="110" y="30" class="label" text-anchor="middle">バックルーム / 倉庫 (10㎡)</text>
      
      <!-- F Refrigerators -->
      <rect x="20" y="50" width="70" height="60" class="equipment"/>
      <text x="55" y="85" class="small-label" text-anchor="middle">F 業務用冷蔵庫</text>
      
      <!-- Z Freezers -->
      <rect x="110" y="50" width="70" height="60" class="equipment"/>
      <text x="145" y="85" class="small-label" text-anchor="middle">Z 業務用冷凍庫</text>

      <!-- WSS Storage -->
      <rect x="20" y="140" width="160" height="70" class="equipment"/>
      <text x="100" y="180" class="small-label" text-anchor="middle">WSS 資材保管・ゴミ置き場</text>
    </g>

    <!-- REAR RICE LINE (Top Wall) -->
    <g transform="translate(20, 10)">
      <rect x="0" y="0" width="640" height="85" fill="#FED7AA" stroke="#EA580C" stroke-dasharray="2,2" rx="4"/>
      
      <!-- RW 洗米機 -->
      <rect x="10" y="10" width="60" height="65" class="equipment"/>
      <text x="40" y="48" class="small-label" text-anchor="middle">RW 洗米機</text>

      <!-- RC1 炊飯器1 -->
      <rect x="80" y="10" width="65" height="65" class="highlight-equip"/>
      <text x="112" y="48" class="small-label" text-anchor="middle">RC1 炊飯器1</text>

      <!-- RC2 炊飯器2 -->
      <rect x="155" y="10" width="65" height="65" class="highlight-equip"/>
      <text x="187" y="48" class="small-label" text-anchor="middle">RC2 炊飯器2</text>

      <!-- SM 酢合わせ機 -->
      <rect x="230" y="10" width="65" height="65" class="equipment"/>
      <text x="262" y="48" class="small-label" text-anchor="middle">SM 酢合わせ機</text>

      <!-- SR1 シャリロボ1 -->
      <rect x="305" y="10" width="60" height="65" class="equipment"/>
      <text x="335" y="48" class="small-label" text-anchor="middle">SR1 シャリロボ</text>

      <!-- シャリ作業台1 -->
      <rect x="375" y="10" width="55" height="65" class="equipment"/>
      <text x="402" y="48" class="small-label" text-anchor="middle">シャリ桶1</text>

      <!-- SR2 シャリロボ2 -->
      <rect x="440" y="10" width="60" height="65" class="equipment"/>
      <text x="470" y="48" class="small-label" text-anchor="middle">SR2 シャリロボ</text>

      <!-- SUZUMO 巻きロボ (NEW!) -->
      <rect x="510" y="10" width="65" height="65" class="red-equip"/>
      <text x="542" y="40" class="small-label" text-anchor="middle" font-weight="bold" fill="#DC2626">SUZUMO</text>
      <text x="542" y="54" class="small-label" text-anchor="middle">巻きロボ</text>

      <!-- シャリ作業台2 -->
      <rect x="585" y="10" width="45" height="65" class="equipment"/>
      <text x="607" y="48" class="small-label" text-anchor="middle">シャリ桶2</text>
    </g>

    <!-- MIDDLE PREP & FISH AREA -->
    <g transform="translate(40, 130)">
      <rect x="0" y="0" width="600" height="95" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" rx="4"/>
      
      <!-- S 仕込シンク -->
      <rect x="15" y="15" width="80" height="65" class="blue-equip"/>
      <text x="55" y="52" class="small-label" text-anchor="middle">S 仕込シンク</text>

      <!-- Dedicated Handwashing Sink (HS) NEW! -->
      <rect x="105" y="15" width="60" height="65" class="blue-equip"/>
      <text x="135" y="44" class="small-label" text-anchor="middle" font-weight="bold" fill="#0284C7">手洗い専用</text>
      <text x="135" y="58" class="small-label" text-anchor="middle">シンク (HS)</text>

      <!-- 魚切付・ネタ準備台 -->
      <rect x="175" y="15" width="410" height="65" class="equipment"/>
      <text x="380" y="52" class="label" text-anchor="middle">魚切付・ネタ準備まな板エリア</text>
    </g>

    <!-- COMPLETE BLIND PARTITION WALL (目隠し完全仕切り壁) -->
    <g transform="translate(0, 255)">
      <rect x="0" y="0" width="680" height="14" class="partition-wall"/>
      <text x="340" y="-6" class="small-label" text-anchor="middle" fill="#DC2626" font-weight="bold">【完全目隠し仕切り壁】(お客様から仕込み場が見えない壁)</text>
      
      <!-- Stainless Pass-through Hatch (受渡し扉) -->
      <rect x="420" y="-3" width="100" height="20" fill="#FEF08A" stroke="#CA8A04" stroke-width="2"/>
      <text x="470" y="11" class="small-label" text-anchor="middle" font-weight="bold">受渡し扉(HACCP)</text>
    </g>

    <!-- FRONT LIVE KITCHEN & FRONT COUNTER (Bottom Area) -->
    <g transform="translate(20, 290)">
      
      <!-- POS Register on Left Edge -->
      <g transform="translate(10, 80)">
        <rect x="0" y="0" width="80" height="110" class="red-equip"/>
        <text x="40" y="50" class="label" text-anchor="middle" fill="#DC2626">POS会計レジ</text>
        <text x="40" y="70" class="small-label" text-anchor="middle">(左側配置)</text>
      </g>

      <!-- Subway-style Live Kitchen Showcase (Left Side) -->
      <g transform="translate(100, 80)">
        <rect x="0" y="0" width="340" height="110" fill="#FEF9C3" stroke="#CA8A04" stroke-width="3" rx="4"/>
        <text x="170" y="40" class="label" text-anchor="middle">【Subway風 対面ライブネタケース】</text>
        <text x="170" y="65" class="small-label" text-anchor="middle">目の前で成形シャリにネタを載せる対面カウンター</text>
        <text x="170" y="85" class="small-label" text-anchor="middle" fill="#B45309">(注文・組み立てライブキッチン)</text>
      </g>

      <!-- Sales Stock Takeaway Showcase (Right Side) -->
      <g transform="translate(450, 80)">
        <rect x="0" y="0" width="200" height="110" fill="#FFEDD5" stroke="#C2410C" stroke-width="3" rx="4"/>
        <text x="100" y="45" class="label" text-anchor="middle" fill="#C2410C">【販売用ストック】</text>
        <text x="100" y="65" class="label" text-anchor="middle" fill="#C2410C">持ち帰り寿司ケース</text>
        <text x="100" y="85" class="small-label" text-anchor="middle">(即買いテイクアウト)</text>
      </g>

      <!-- Pickup Shelf T -->
      <g transform="translate(660, 80)">
        <rect x="0" y="0" width="80" height="110" class="highlight-equip"/>
        <text x="40" y="55" class="small-label" text-anchor="middle" font-weight="bold">保温受取棚</text>
        <text x="40" y="70" class="small-label" text-anchor="middle">(T)</text>
      </g>

    </g>

    <!-- CUSTOMER FLOW LINE (Yellow Dotted) -->
    <!-- Entrance from Mall aisle right -> stock showcase -> live showcase -> POS -> to Left Outside Seating -->
    <path d="M 750 500 L 460 500 L 220 500 L 60 500 L 60 440 L -60 440" class="flow-customer"/>
    <text x="500" y="515" class="small-label" fill="#CA8A04" font-weight="bold">①商品を見る・選ぶ</text>
    <text x="140" y="515" class="small-label" fill="#DC2626" font-weight="bold">②左側POSで会計</text>
    <text x="-40" y="425" class="small-label" fill="#0284C7" font-weight="bold">③そのまま左外の客席へ</text>

    <!-- STAFF FLOW LINE (Blue Solid) -->
    <path d="M 600 80 L 600 170 L 470 170 L 470 270 L 270 270 L 270 360" class="flow-staff"/>
    <text x="490" y="220" class="small-label" fill="#2563EB">受渡し扉</text>

  </g>

</svg>
