<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&amp;display=swap');
      text { font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif; }
      
      .title-head { font-weight: 900; font-size: 26px; fill: #1E293B; letter-spacing: -0.5px; }
      .label-callout { font-weight: 700; font-size: 13.5px; fill: #0F172A; }
      .label-sub { font-weight: 500; font-size: 11.5px; fill: #475569; }
      
      .shadow-soft { filter: drop-shadow(0px 8px 16px rgba(0,0,0,0.15)); }
      .shadow-counter { filter: drop-shadow(0px 10px 20px rgba(0,0,0,0.22)); }
      .glow-sign { filter: drop-shadow(0px 0px 12px rgba(255,209,0,0.85)); }
    </style>

    <!-- Warm Perspective Gradients -->
    <linearGradient id="mallFloor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="40%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="storeFloor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <linearGradient id="woodBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="woodCounter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="glassReflect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#BAE6FD" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#7DD3FC" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="signBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <linearGradient id="stainless" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Hatch Pattern for Blind Wall -->
    <pattern id="hatchBlind" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#DC2626" stroke-width="3"/>
    </pattern>
  </defs>

  <!-- Background Wallpaper / Mall Environment -->
  <rect width="100%" height="100%" fill="#F1F5F9"/>

  <!-- TOP HEADER (1枚目画像風タイトル) -->
  <g transform="translate(60, 42)">
    <text class="title-head">Genki Sushi Express パターンA ［壁面一直線型 / 45㎡］ 3D正面パース図</text>
  </g>

  <!-- MAIN PERSPECTIVE SCENE -->
  <g transform="translate(60, 65)">
    <!-- Main Framing Canvas -->
    <rect width="1800" height="960" fill="#E2E8F0" rx="12" class="shadow-soft"/>

    <!-- 1. MALL ENVIRONMENT BACKGROUND (ショッピングモール背景) -->
    <!-- Mall Back Walls & Hallways -->
    <polygon points="0,0 1800,0 1800,520 0,520" fill="#CBD5E1"/>
    <!-- Store Alcove Recess -->
    <polygon points="280,100 1620,100 1620,520 280,520" fill="#94A3B8"/>
    
    <!-- Floor Tile (モール床面 Perspective Grid) -->
    <polygon points="0,520 1800,520 1800,960 0,960" fill="url(#mallFloor)"/>
    <!-- Store Interior Floor Tile -->
    <polygon points="280,520 1620,520 1720,860 180,860" fill="url(#storeFloor)"/>

    <!-- Left Store Wall (木目アクセントクロス) -->
    <polygon points="280,100 360,120 360,520 280,520" fill="#B45309"/>
    <circle cx="320" cy="220" r="28" fill="#FFD100" stroke="#000" stroke-width="2"/>
    <path d="M 305 212 Q 320 200 335 212" stroke="#000" stroke-width="2.5" fill="none"/>
    <circle cx="310" cy="220" r="3" fill="#000"/>
    <circle cx="330" cy="220" r="3" fill="#000"/>
    <circle cx="308" cy="226" r="4" fill="#E60012"/>
    <circle cx="332" cy="226" r="4" fill="#E60012"/>
    <text x="320" y="270" font-weight="900" font-size="14" fill="#FFFFFF" text-anchor="middle">Genki Sushi</text>

    <!-- 2. REAR KITCHEN WALL & EQUIPMENT (背面壁面一直線機器ライン) -->
    <g transform="translate(360, 160)">
      <!-- Backroom Stainless Wall background -->
      <rect width="1240" height="260" fill="#E2E8F0"/>
      <rect x="0" y="0" width="1240" height="15" fill="#64748B"/>

      <!-- Equipment Units Alignment (Left to Right: 3槽シンク -> 食洗機 -> HS -> まな板 -> RC1/RC2 -> SUZUMO -> SR1/SR2 -> Refrigerator) -->
      <!-- Stainless Upper Shelf Line -->
      <rect x="40" y="30" width="1160" height="12" fill="url(#stainless)"/>

      <!-- 3槽シンク & 食洗機 & 手洗いシンク(HS) -->
      <rect x="40" y="110" width="160" height="110" fill="url(#stainless)" stroke="#475569"/>
      <rect x="210" y="110" width="100" height="110" fill="url(#stainless)" stroke="#475569"/>
      <!-- HS (Handwash Sink) -->
      <rect x="320" y="110" width="70" height="110" fill="url(#stainless)" stroke="#0284C7" stroke-width="2"/>
      <circle cx="355" cy="140" r="14" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5"/>

      <!-- 鮮魚まな板作業台 -->
      <rect x="400" y="110" width="180" height="110" fill="url(#stainless)" stroke="#475569"/>
      <rect x="420" y="125" width="140" height="40" fill="#FEF08A" stroke="#CA8A04" rx="3"/>

      <!-- RC1 & RC2 (IH炊飯器2台) -->
      <rect x="590" y="120" width="90" height="100" fill="url(#stainless)" stroke="#B45309" stroke-width="2"/>
      <circle cx="635" cy="150" r="22" fill="#FEF08A" stroke="#B45309" stroke-width="2"/>
      <rect x="690" y="120" width="90" height="100" fill="url(#stainless)" stroke="#B45309" stroke-width="2"/>
      <circle cx="735" cy="150" r="22" fill="#FEF08A" stroke="#B45309" stroke-width="2"/>

      <!-- SUZUMO 巻き寿司ロボ (Highlight Red) -->
      <rect x="790" y="100" width="110" height="120" fill="#FEE2E2" stroke="#DC2626" stroke-width="3" rx="4" class="shadow-soft"/>
      <rect x="805" y="115" width="80" height="55" fill="#FFFFFF" stroke="#DC2626" stroke-width="2" rx="4"/>
      <text x="845" y="142" font-weight="900" font-size="12" fill="#DC2626" text-anchor="middle">SUZUMO</text>
      <text x="845" y="158" font-weight="900" font-size="10" fill="#DC2626" text-anchor="middle">巻きロボ</text>

      <!-- SR1 & SR2 (シャリロボ) -->
      <rect x="910" y="120" width="90" height="100" fill="url(#stainless)" stroke="#0284C7" stroke-width="2"/>
      <rect x="1010" y="120" width="90" height="100" fill="url(#stainless)" stroke="#0284C7" stroke-width="2"/>

      <!-- Refrigerator & Freezer (右端) -->
      <rect x="1110" y="40" width="110" height="180" fill="url(#stainless)" stroke="#334155" stroke-width="2"/>
      <line x1="1165" y1="40" x2="1165" y2="220" stroke="#475569" stroke-width="2"/>
    </g>

    <!-- 3. COMPLETE BLIND PARTITION WALL (完全目隠し仕切り壁 ＆ 受渡し扉) -->
    <g transform="translate(360, 390)">
      <!-- Solid Wall Structure -->
      <rect x="0" y="0" width="1260" height="40" fill="url(#hatchBlind)" stroke="#0F172A" stroke-width="3"/>
      <rect x="0" y="0" width="1260" height="40" fill="none" stroke="#DC2626" stroke-width="3"/>
      
      <!-- Pass-through Hatch (受渡し扉) -->
      <g transform="translate(860, -10)" class="shadow-soft">
        <rect width="150" height="55" fill="#FEF08A" stroke="#CA8A04" stroke-width="3" rx="6"/>
        <text x="75" y="34" font-weight="900" font-size="15" fill="#78350F" text-anchor="middle">受渡し扉 (HACCP)</text>
      </g>
    </g>

    <!-- 4. FRONT STORE COUNTERS & SHOWCASES (前面接客カウンターライン) -->
    <!-- Front Wood Counter Base Wall -->
    <g transform="translate(340, 480)" class="shadow-counter">

      <!-- A. Subway-style Live Showcase (前面右側 2.5m) -->
      <g transform="translate(560, 40)">
        <!-- Wood Cabinet -->
        <polygon points="0,60 520,60 580,220 0,220" fill="url(#woodBase)"/>
        <polygon points="0,0 520,0 520,60 0,60" fill="url(#woodCounter)"/>
        
        <!-- Glass Display Case Top -->
        <polygon points="15,5 505,5 505,60 15,60" fill="url(#glassReflect)" stroke="#0284C7" stroke-width="2"/>
        <polygon points="15,60 505,60 560,205 15,205" fill="url(#glassReflect)" stroke="#0284C7" stroke-width="2"/>

        <!-- Individual Fresh Topping Trays (Subway風 鮮魚生ネタ保冷バット) -->
        <g transform="translate(40, 80)">
          <rect x="0" y="0" width="50" height="40" fill="#EF4444" rx="4"/>
          <rect x="60" y="0" width="50" height="40" fill="#F97316" rx="4"/>
          <rect x="120" y="0" width="50" height="40" fill="#EAB308" rx="4"/>
          <rect x="180" y="0" width="50" height="40" fill="#10B981" rx="4"/>
          <rect x="240" y="0" width="50" height="40" fill="#3B82F6" rx="4"/>
          <rect x="300" y="0" width="50" height="40" fill="#8B5CF6" rx="4"/>
          <rect x="360" y="0" width="50" height="40" fill="#EC4899" rx="4"/>
        </g>
      </g>

      <!-- B. POS Register Counter (前面中央左寄) -->
      <g transform="translate(380, 40)">
        <polygon points="0,40 160,40 180,220 0,220" fill="url(#woodBase)"/>
        <polygon points="0,0 160,0 160,40 0,40" fill="url(#woodCounter)"/>
        
        <!-- POS Terminals (Dual Screen) -->
        <rect x="25" y="-35" width="50" height="45" fill="#0F172A" rx="4" stroke="#475569" stroke-width="2"/>
        <rect x="30" y="-30" width="40" height="30" fill="#38BDF8"/>
        <rect x="85" y="-35" width="50" height="45" fill="#0F172A" rx="4" stroke="#475569" stroke-width="2"/>
        <rect x="90" y="-30" width="40" height="30" fill="#FFD100"/>
      </g>

      <!-- C. Grab & Go Takeaway Stock Showcase (前面左側 1.8m) -->
      <g transform="translate(0, 40)">
        <polygon points="0,60 360,60 400,220 0,220" fill="url(#woodBase)"/>
        <polygon points="0,0 360,0 360,60 0,60" fill="url(#woodCounter)"/>
        
        <!-- Multi-Tier Shelved Display Case (即買グラブ＆ゴー ディスプレイ) -->
        <polygon points="15,5 345,5 345,60 15,60" fill="url(#glassReflect)" stroke="#C2410C" stroke-width="2"/>
        <polygon points="15,60 345,60 380,205 15,205" fill="#FED7AA" stroke="#C2410C" stroke-width="2"/>
        
        <!-- Packaged Sushi Boxes (寿司ボックス各種) -->
        <g transform="translate(30, 80)">
          <rect x="0" y="0" width="65" height="35" fill="#FDBA74" stroke="#EA580C" rx="4"/>
          <rect x="80" y="0" width="65" height="35" fill="#FDBA74" stroke="#EA580C" rx="4"/>
          <rect x="160" y="0" width="65" height="35" fill="#FDBA74" stroke="#EA580C" rx="4"/>
          <rect x="240" y="0" width="65" height="35" fill="#FDBA74" stroke="#EA580C" rx="4"/>

          <rect x="0" y="50" width="65" height="35" fill="#FDBA74" stroke="#EA580C" rx="4"/>
          <rect x="80" y="50" width="65" height="35" fill="#FDBA74" stroke="#EA580C" rx="4"/>
          <rect x="160" y="50" width="65" height="35" fill="#FDBA74" stroke="#EA580C" rx="4"/>
          <rect x="240" y="50" width="65" height="35" fill="#FDBA74" stroke="#EA580C" rx="4"/>
        </g>
      </g>

    </g>

    <!-- 5. MAIN STOREFRONT OVERHEAD SIGNBOARD (大型メイン看板) -->
    <g transform="translate(380, 50)" class="glow-sign">
      <rect width="1180" height="90" fill="url(#signBg)" stroke="#0F172A" stroke-width="4" rx="8"/>
      
      <!-- Mascot Face Circle -->
      <circle cx="70" cy="45" r="32" fill="#FFD100" stroke="#000" stroke-width="3"/>
      <path d="M 52 35 Q 70 20 88 35" stroke="#000" stroke-width="3.5" fill="none"/>
      <circle cx="60" cy="44" r="3.5" fill="#000"/>
      <circle cx="80" cy="44" r="3.5" fill="#000"/>
      <circle cx="56" cy="52" r="5" fill="#E60012"/>
      <circle cx="84" cy="52" r="5" fill="#E60012"/>
      <path d="M 60 60 Q 70 68 80 60" stroke="#000" stroke-width="3" fill="none"/>

      <!-- Sign Text -->
      <text x="125" y="58" font-weight="900" font-size="44" fill="#0F172A" letter-spacing="-1px">Genki Sushi</text>
      
      <rect x="375" y="25" width="110" height="42" fill="#E60012" rx="21"/>
      <text x="430" y="53" font-weight="900" font-size="20" fill="#FFFFFF" text-anchor="middle">Express</text>

      <text x="505" y="60" font-weight="900" font-size="36" fill="#0F172A">元気寿司</text>
      <text x="660" y="60" font-weight="900" font-size="28" fill="#E60012">エクスプレス</text>

      <!-- Menu Board Flanking -->
      <rect x="940" y="12" width="220" height="66" fill="#0F172A" rx="4"/>
      <text x="1050" y="40" font-weight="700" font-size="14" fill="#FFD100" text-anchor="middle">SUSHI MENU</text>
      <text x="1050" y="60" font-weight="500" font-size="11" fill="#FFFFFF" text-anchor="middle">写真メニューパネル</text>
    </g>

    <!-- 6. OUTSIDE SEATING (左側 敷地外イートイン 8席) -->
    <g transform="translate(40, 560)" class="shadow-soft">
      <rect width="240" height="340" fill="none" stroke="#0284C7" stroke-width="3" stroke-dasharray="8,4" rx="12"/>
      <rect x="30" y="-16" width="180" height="32" fill="#0284C7" rx="6"/>
      <text x="120" y="6" font-weight="900" font-size="14" fill="#FFFFFF" text-anchor="middle">敷地外イートイン(8席)</text>

      <!-- Table 1 (4 Seats) -->
      <g transform="translate(45, 40)">
        <rect width="70" height="70" fill="url(#woodCounter)" stroke="#78350F" stroke-width="2.5" rx="8"/>
        <circle cx="-12" cy="35" r="12" fill="#475569"/>
        <circle cx="82" cy="35" r="12" fill="#475569"/>
        <circle cx="35" cy="-12" r="12" fill="#475569"/>
        <circle cx="35" cy="82" r="12" fill="#475569"/>
        <text x="35" y="42" font-weight="900" font-size="14" fill="#78350F" text-anchor="middle">4席</text>
      </g>

      <!-- Table 2 (4 Seats) -->
      <g transform="translate(125, 180)">
        <rect width="70" height="70" fill="url(#woodCounter)" stroke="#78350F" stroke-width="2.5" rx="8"/>
        <circle cx="-12" cy="35" r="12" fill="#475569"/>
        <circle cx="82" cy="35" r="12" fill="#475569"/>
        <circle cx="35" cy="-12" r="12" fill="#475569"/>
        <circle cx="35" cy="82" r="12" fill="#475569"/>
        <text x="35" y="42" font-weight="900" font-size="14" fill="#78350F" text-anchor="middle">4席</text>
      </g>
    </g>

    <!-- 7. REALISTIC PEOPLE SILHOUETTES / ILLUSTRATIONS (人物描写) -->
    <!-- Chef behind counter -->
    <g transform="translate(1000, 420)">
      <circle cx="20" cy="0" r="16" fill="#FED7AA"/>
      <rect x="4" y="-22" width="32" height="12" fill="#FFFFFF" rx="2"/>
      <polygon points="0,16 40,16 45,90 -5,90" fill="#FFFFFF"/>
      <text x="20" y="-30" font-weight="700" font-size="11" fill="#1E293B" text-anchor="middle">寿司職人</text>
    </g>
    <!-- Customer at POS -->
    <g transform="translate(760, 620)">
      <circle cx="20" cy="0" r="16" fill="#FCA5A5"/>
      <polygon points="-5,16 45,16 50,110 -10,110" fill="#1E293B"/>
    </g>
    <!-- Customer at Grab&Go -->
    <g transform="translate(480, 640)">
      <circle cx="20" cy="0" r="16" fill="#FECDD3"/>
      <polygon points="-5,16 45,16 50,110 -10,110" fill="#0284C7"/>
    </g>

    <!-- =============================================================== -->
    <!-- 8. ANNOTATION CALLOUT LINES & LABELS (1枚目画像風 引き出し線注記) -->
    <!-- =============================================================== -->
    <!-- Callout 1: Subway風対面ネタケース 2.5m -->
    <g transform="translate(1250, 780)">
      <polyline points="0,0 -80,-80 -160,-80" stroke="#0F172A" stroke-width="2" fill="none"/>
      <circle cx="0" cy="0" r="4" fill="#0F172A"/>
      <text x="15" y="5" class="label-callout">Subway風対面ネタケース 2.5m</text>
      <text x="15" y="22" class="label-sub">（鮮魚ネタ目の前でオーダー・手渡し）</text>
    </g>

    <!-- Callout 2: POS会計レジ -->
    <g transform="translate(800, 790)">
      <polyline points="0,0 0,60 60,60" stroke="#0F172A" stroke-width="2" fill="none"/>
      <circle cx="0" cy="0" r="4" fill="#0F172A"/>
      <text x="70" y="65" class="label-callout">POS会計レジ</text>
      <text x="70" y="82" class="label-sub">（左側配置・スムーズ一方向会計）</text>
    </g>

    <!-- Callout 3: 作り置き・持ち帰りショーケース 1.8m -->
    <g transform="translate(380, 780)">
      <polyline points="0,0 -50,60 -120,60" stroke="#0F172A" stroke-width="2" fill="none"/>
      <circle cx="0" cy="0" r="4" fill="#0F172A"/>
      <text x="-130" y="65" class="label-callout" text-anchor="end">作り置き・持ち帰りショーケース 1.8m</text>
      <text x="-130" y="82" class="label-sub" text-anchor="end">（即買グラブ＆ゴー ディスプレイ）</text>
    </g>

    <!-- Callout 4: 完全目隠し仕切り壁 -->
    <g transform="translate(1550, 410)">
      <polyline points="0,0 -80,-30 -160,-30" stroke="#DC2626" stroke-width="2" fill="none"/>
      <circle cx="0" cy="0" r="4" fill="#DC2626"/>
      <text x="-170" y="-25" class="label-callout" fill="#DC2626" text-anchor="end">完全目隠し仕切り壁 (仕込み場非公開)</text>
    </g>

    <!-- Callout 5: 手洗い専用シンク(HS) & SUZUMO巻きロボ -->
    <g transform="translate(1420, 220)">
      <polyline points="0,0 -60,-60 -120,-60" stroke="#0F172A" stroke-width="2" fill="none"/>
      <circle cx="0" cy="0" r="4" fill="#0F172A"/>
      <text x="-130" y="-65" class="label-callout" text-anchor="end">炊飯・シャリ加工・SUZUMO巻きロボ</text>
      <text x="-130" y="-48" class="label-sub" text-anchor="end">＆ 手洗い専用シンク(HS)</text>
    </g>

  </g>
</svg>
